<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezent dla Wiki ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        /* Ogólne style */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Ekran z hasłem */
        #login-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        #login-screen h1 {
            font-size: 2rem;
            color: #b366ff;
            margin-bottom: 10px;
            text-align: center;
        }

        #login-screen p {
            color: #888;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input[type="text"] {
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #b366ff;
            border-radius: 10px;
            background: rgba(179, 102, 255, 0.1);
            color: white;
            text-align: center;
            outline: none;
            width: 250px;
            letter-spacing: 2px;
        }

        button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #7a00ff, #b366ff);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(179, 102, 255, 0.6);
        }

        #error-msg {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        /* Ekran z biletem */
        #ticket-screen {
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .ticket-container {
            max-width: 900px;
            width: 100%;
            box-shadow: 0 0 50px rgba(122, 0, 255, 0.4);
            border-radius: 15px;
            overflow: hidden;
        }

        .ticket-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animacja pojawiania się */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .fade-in {
            opacity: 1 !important;
        }

        @media (max-width: 600px) {
            #login-screen h1 { font-size: 1.5rem; }
            input[type="text"] { width: 200px; }
        }
    </style>
</head>
<body>

    <!-- Ekran logowania -->
    <div id="login-screen">
        <h1>Wpisz hasło, aby zobaczyć prezent...</h1>
        <p>Podpowiedź: Data, która nas połączyła (format: DD.MM.RRRR)</p>
        <div class="input-group">
            <input type="text" id="password-input" placeholder="np. 01.01.2024" autocomplete="off">
            <button onclick="checkPassword()">Odblokuj ❤️</button>
            <p id="error-msg">Błędne hasło. Spróbuj jeszcze raz, Kochanie!</p>
        </div>
    </div>

    <!-- Ekran z biletem -->
    <div id="ticket-screen">
        <div class="ticket-container">
            <!-- Poniżej wklejasz zdjęcie swojego biletu -->
            <!-- ZMIEŃ 'bilet.jpg' na nazwę pliku ze zdjęciem biletu, który masz na komputerze! -->
            <img src="bilet.jpg" alt="Bilet na koncert White 2115" class="ticket-image">
        </div>
    </div>

    <script>
        // TUTAJ USTAW HASŁO - wpisz datę wejścia w związek
        // Możesz zostawić z kropkami lub zmienić na same cyfry (np. "10062026")
        const CORRECT_PASSWORD = "10.06.2026"; 

        function checkPassword() {
            const input = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const loginScreen = document.getElementById('login-screen');
            const ticketScreen = document.getElementById('ticket-screen');

            // Sprawdzamy hasło (ignorujemy wielkość liter, choć tu są same cyfry)
            if (input === CORRECT_PASSWORD) {
                // Hasło poprawne - ukrywamy ekran logowania
                loginScreen.classList.add('fade-out');
                
                // Po krótkiej chwili pokazujemy bilet
                setTimeout(() => {
                    loginScreen.style.display = 'none';
                    ticketScreen.style.display = 'flex';
                    
                    // Małe opóźnienie dla płynnej animacji pojawiania się
                    setTimeout(() => {
                        ticketScreen.classList.add('fade-in');
                    }, 50);
                }, 800);
            } else {
                // Błędne hasło
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
                document.getElementById('password-input').focus();
            }
        }

        // Pozwala zatwierdzić enterem
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>

</body>
</html>
